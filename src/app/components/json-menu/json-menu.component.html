<!-- Valores simples: se muestran directamente; objetos, arreglos y null: se navegan con un botón. -->
<mat-list role="list">
    @for (nodo of arbol(); track nodo.ruta) {
        @if (['string', 'number', 'boolean'].includes(nodo.tipo)) {
            <mat-list-item role="listitem">
                <strong>{{ formarString(nodo.nombre) }}:</strong>&nbsp;{{ nodo.valor }}
            </mat-list-item>
        } @else {
            <mat-list-item role="listitem">
                <button mat-flat-button type="button" (click)="informacionNodo(nodo)">
                    {{ formarString(nodo.nombre) }}
                </button>
            </mat-list-item>
        }
    }
</mat-list>

<!-- Solo se crea la sección de detalle después de seleccionar un nodo navegable. -->
@if (nodoActual(); as nodo) {
    <app-json-secciones [arbol]="nodo"></app-json-secciones>
}
